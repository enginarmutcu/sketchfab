<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sketchfab Custom Pins</title>

    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

        }


        /* =====================================================
           TOOLBAR
           ===================================================== */

        #toolbar {

            height: 55px;

            width: 100%;

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 0 15px;

            background: #252525;

            color: white;

        }


        #toolbar button {

            border: none;

            padding: 8px 15px;

            border-radius: 4px;

            background: #444;

            color: white;

            cursor: pointer;

        }


        #toolbar button:hover {

            background: #555;

        }


        #editModeButton.active {

            background: #198754;

        }


        #modeLabel {

            font-weight: bold;

            margin-right: 15px;

        }


        /* =====================================================
           VIEWER CONTAINER
           ===================================================== */

        #viewerContainer {

            position: relative;

            width: 100%;

            height: calc(100vh - 55px);

            overflow: hidden;

        }


        #api-frame {

            position: absolute;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            border: none;

        }


        /* =====================================================
           PIN LAYER
           ===================================================== */

        /*
         * The layer itself does NOT receive mouse events.
         *
         * Therefore normal clicks pass through to Sketchfab.
         *
         * Individual pins have pointer-events:auto.
         */

        #pinLayer {

            position: absolute;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            pointer-events: none;

            z-index: 10;

        }


        /* =====================================================
           PIN
           ===================================================== */

        .pin {

            position: absolute;

            width: 30px;

            height: 36px;

            transform: translate(-50%, -100%);

            pointer-events: auto;

            cursor: pointer;

            z-index: 20;

        }


        /*
         * Classic red map marker.
         */

        .pinIcon {

            position: absolute;

            left: 3px;

            top: 3px;

            width: 24px;

            height: 24px;

            border-radius: 50% 50% 50% 0;

            transform: rotate(-45deg);

            background: #e53935;

            border: 2px solid white;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.5);

        }


        /*
         * White center.
         */

        .pinIcon::after {

            content: "";

            position: absolute;

            width: 7px;

            height: 7px;

            left: 6.5px;

            top: 6.5px;

            border-radius: 50%;

            background: white;

        }


        .pin:hover .pinIcon {

            background: #ff5252;

            transform:
                rotate(-45deg)
                scale(1.15);

        }


        /* =====================================================
           PIN LABEL
           ===================================================== */

        .pinLabel {

            position: absolute;

            left: 25px;

            bottom: 31px;

            display: none;

            white-space: nowrap;

            max-width: 250px;

            overflow: hidden;

            text-overflow: ellipsis;

            padding: 5px 8px;

            border-radius: 4px;

            background:
                rgba(0, 0, 0, 0.85);

            color: white;

            font-size: 12px;

            pointer-events: none;

        }


        .pin:hover .pinLabel {

            display: block;

        }


        /* =====================================================
           STATUS
           ===================================================== */

        #status {

            position: absolute;

            left: 15px;

            bottom: 15px;

            z-index: 50;

            padding: 7px 11px;

            border-radius: 4px;

            background:
                rgba(0, 0, 0, 0.75);

            color: white;

            font-size: 13px;

            pointer-events: none;

        }


        /* =====================================================
           MODAL
           ===================================================== */

        #modalOverlay {

            display: none;

            position: fixed;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            z-index: 1000;

            justify-content: center;

            align-items: center;

            background:
                rgba(0, 0, 0, 0.65);

        }


        #modal {

            width: 450px;

            max-width: 90%;

            padding: 25px;

            border-radius: 8px;

            background: white;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5);

        }


        #modal h2 {

            margin-top: 0;

            margin-bottom: 20px;

        }


        .formGroup {

            margin-bottom: 15px;

        }


        .formGroup label {

            display: block;

            margin-bottom: 5px;

            font-weight: bold;

        }


        .formGroup input,
        .formGroup textarea {

            width: 100%;

            padding: 9px;

            border: 1px solid #ccc;

            border-radius: 4px;

            font-size: 14px;

        }


        .formGroup textarea {

            height: 120px;

            resize: vertical;

        }


        #coordinates {

            margin-top: 10px;

            padding: 8px;

            border-radius: 4px;

            background: #f4f4f4;

            font-family: monospace;

            font-size: 12px;

            color: #555;

        }


        /* =====================================================
           MODAL BUTTONS
           ===================================================== */

        #modalButtons {

            display: flex;

            justify-content: space-between;

            margin-top: 20px;

        }


        #leftButtons,
        #rightButtons {

            display: flex;

            gap: 8px;

        }


        #modalButtons button {

            padding: 8px 15px;

            border: none;

            border-radius: 4px;

            cursor: pointer;

        }


        #saveButton {

            background: #198754;

            color: white;

        }


        #cancelButton {

            background: #6c757d;

            color: white;

        }


        #deleteButton {

            background: #dc3545;

            color: white;

        }


        /* =====================================================
           INFO MODAL
           ===================================================== */

        #infoOverlay {

            display: none;

            position: fixed;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            z-index: 1100;

            justify-content: center;

            align-items: center;

            background:
                rgba(0, 0, 0, 0.55);

        }


        #infoBox {

            width: 400px;

            max-width: 90%;

            padding: 25px;

            border-radius: 8px;

            background: white;

        }


        #infoBox h2 {

            margin-top: 0;

        }


        #closeInfoButton {

            margin-top: 20px;

            padding: 8px 15px;

            border: none;

            border-radius: 4px;

            background: #555;

            color: white;

            cursor: pointer;

        }

    </style>

</head>


<body>


<!-- =========================================================
     TOOLBAR
     ========================================================= -->

<div id="toolbar">

    <button id="editModeButton">

        Enable Edit Mode

    </button>


    <span id="modeLabel">

        Edit Mode: OFF

    </span>


    <button id="exportButton">

        Export Pins

    </button>


    <button id="clearButton">

        Clear All

    </button>

</div>


<!-- =========================================================
     VIEWER
     ========================================================= -->

<div id="viewerContainer">

    <iframe
        id="api-frame"
        allow="autoplay; fullscreen; xr-spatial-tracking"
        allowfullscreen>
    </iframe>


    <!--
         Custom pins are rendered here.
    -->

    <div id="pinLayer"></div>


    <div id="status">

        Loading...

    </div>

</div>


<!-- =========================================================
     NEW / EDIT MODAL
     ========================================================= -->

<div id="modalOverlay">

    <div id="modal">

        <h2 id="modalTitle">

            New Pin

        </h2>


        <div class="formGroup">

            <label for="pinTitle">

                Title

            </label>

            <input
                id="pinTitle"
                type="text"
                maxlength="200"
            >

        </div>


        <div class="formGroup">

            <label for="pinDescription">

                Description

            </label>

            <textarea
                id="pinDescription">
            </textarea>

        </div>


        <div id="coordinates">

            X: -
            <br>

            Y: -
            <br>

            Z: -

        </div>


        <div id="modalButtons">


            <div id="leftButtons">

                <button id="deleteButton">

                    Delete

                </button>

            </div>


            <div id="rightButtons">

                <button id="cancelButton">

                    Cancel

                </button>


                <button id="saveButton">

                    Save

                </button>

            </div>


        </div>

    </div>

</div>


<!-- =========================================================
     VIEW PIN MODAL
     ========================================================= -->

<div id="infoOverlay">

    <div id="infoBox">

        <h2 id="infoTitle"></h2>

        <div id="infoText"></div>

        <button id="closeInfoButton">

            Close

        </button>

    </div>

</div>


<script>


/* ============================================================
   CONFIGURATION
   ============================================================ */


/*
 * Replace with your actual Sketchfab model UID.
 */

const MODEL_UID =
    "c078f9af15884a6b820c7e778831b110";


/*
 * This can later correspond to your database model ID.
 */

const MODEL_ID =
    "A320_MODEL";


/*
 * Temporary local storage.
 *
 * Later you can replace savePins/loadPins
 * with AJAX calls to your Java backend.
 */

const STORAGE_KEY =
    "sketchfab-custom-pins-" +
    MODEL_ID;


/* ============================================================
   GLOBAL VARIABLES
   ============================================================ */

let api = null;

let editMode = false;

let pins = [];

let editingPin = null;

let newPinPosition = null;


/*
 * Indicates whether the camera is currently moving.
 */

let cameraMoving = false;


/*
 * requestAnimationFrame ID.
 */

let pinAnimationFrame = null;


/* ============================================================
   DOM ELEMENTS
   ============================================================ */

const iframe =
    document.getElementById(
        "api-frame"
    );


const pinLayer =
    document.getElementById(
        "pinLayer"
    );


const status =
    document.getElementById(
        "status"
    );


const editModeButton =
    document.getElementById(
        "editModeButton"
    );


const modeLabel =
    document.getElementById(
        "modeLabel"
    );


const modalOverlay =
    document.getElementById(
        "modalOverlay"
    );


const modalTitle =
    document.getElementById(
        "modalTitle"
    );


const pinTitle =
    document.getElementById(
        "pinTitle"
    );


const pinDescription =
    document.getElementById(
        "pinDescription"
    );


const coordinates =
    document.getElementById(
        "coordinates"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


const deleteButton =
    document.getElementById(
        "deleteButton"
    );


const infoOverlay =
    document.getElementById(
        "infoOverlay"
    );


const infoTitle =
    document.getElementById(
        "infoTitle"
    );


const infoText =
    document.getElementById(
        "infoText"
    );


const closeInfoButton =
    document.getElementById(
        "closeInfoButton"
    );


/* ============================================================
   SKETCHFAB INITIALIZATION
   ============================================================ */

const client =
    new Sketchfab(
        "1.12.1",
        iframe
    );


client.init(
    MODEL_UID,
    {

        success: function(viewerApi) {

            api =
                viewerApi;


            api.start();


            api.addEventListener(
                "viewerready",
                function() {

                    setStatus(
                        "Viewer ready"
                    );


                    initializeViewer();

                }
            );

        },


        error: function() {

            setStatus(
                "Sketchfab initialization failed"
            );

        }

    }
);


/* ============================================================
   INITIALIZE VIEWER
   ============================================================ */

function initializeViewer() {

    /*
     * Load pins.
     */

    loadPins();


    /*
     * Model click.
     */

    initializeModelClick();


    /*
     * Camera events.
     */

    api.addEventListener(
        "camerastart",
        function() {

            cameraMoving = true;

            startPinAnimation();

        }
    );


    api.addEventListener(
        "camerastop",
        function() {

            cameraMoving = false;

            /*
             * One final update.
             */

            updatePinPositions();

        }
    );


    /*
     * Browser resize.
     */

    window.addEventListener(
        "resize",
        function() {

            updatePinPositions();

        }
    );


    /*
     * Initial position.
     */

    updatePinPositions();

}


/* ============================================================
   MODEL CLICK
   ============================================================ */

function initializeModelClick() {

    api.addEventListener(
        "click",
        function(info) {

            /*
             * No 3D intersection.
             */

            if (!info.position3D) {

                return;

            }


            console.log(
                "MODEL CLICK:",
                info.position3D
            );


            /*
             * View mode.
             *
             * Clicking the model does nothing.
             */

            if (!editMode) {

                return;

            }


            /*
             * Edit mode.
             *
             * Create new pin.
             */

            openNewPinModal(
                info.position3D
            );

        },
        {
            pick: "slow"
        }
    );

}


/* ============================================================
   CREATE PIN ELEMENT
   ============================================================ */

function createPinElement(pin) {

    /*
     * Create container.
     */

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "pin";


    /*
     * Pin icon.
     */

    const icon =
        document.createElement(
            "div"
        );


    icon.className =
        "pinIcon";


    /*
     * Label.
     */

    const label =
        document.createElement(
            "div"
        );


    label.className =
        "pinLabel";


    label.innerText =
        pin.title;


    element.appendChild(
        icon
    );


    element.appendChild(
        label
    );


    /*
     * ========================================================
     * PIN CLICK
     * ========================================================
     *
     * This is an HTML element ABOVE the iframe.
     *
     * Therefore the Sketchfab iframe click event does NOT
     * receive this click.
     */

    element.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            event.stopPropagation();


            console.log(
                "PIN CLICK:",
                pin
            );


            if (editMode) {

                openEditPinModal(
                    pin
                );

            }
            else {

                showPinInfo(
                    pin
                );

            }

        }
    );


    /*
     * Store DOM reference.
     */

    pin.element =
        element;


    /*
     * IMPORTANT:
     *
     * Add to DOM immediately.
     *
     * This removes the visible delay while rendering.
     */

    pinLayer.appendChild(
        element
    );


    /*
     * Immediately position this pin.
     */

    updateSinglePinPosition(
        pin
    );

}


/* ============================================================
   UPDATE ONE PIN
   ============================================================ */

function updateSinglePinPosition(pin) {

    if (!api || !pin.element) {

        return;

    }


    api.getWorldToScreenCoordinates(
        pin.position,
        function(coord) {

            if (
                !coord ||
                !coord.canvasCoord
            ) {

                return;

            }


            const x =
                coord.canvasCoord[0];


            const y =
                coord.canvasCoord[1];


            /*
             * Position immediately.
             */

            pin.element.style.left =
                x + "px";


            pin.element.style.top =
                y + "px";


            pin.element.style.display =
                "block";

        }
    );

}


/* ============================================================
   UPDATE ALL PIN POSITIONS
   ============================================================ */

function updatePinPositions() {

    if (!api || !pins.length) {

        return;

    }


    pins.forEach(
        function(pin) {

            updateSinglePinPosition(
                pin
            );

        }
    );

}


/* ============================================================
   CAMERA ANIMATION
   ============================================================ */

function startPinAnimation() {

    /*
     * Already running.
     */

    if (pinAnimationFrame) {

        return;

    }


    function animate() {

        updatePinPositions();


        if (cameraMoving) {

            pinAnimationFrame =
                requestAnimationFrame(
                    animate
                );

        }
        else {

            pinAnimationFrame =
                null;

        }

    }


    pinAnimationFrame =
        requestAnimationFrame(
            animate
        );

}


/* ============================================================
   REMOVE PIN ELEMENT
   ============================================================ */

function removePinElement(pin) {

    if (pin.element) {

        pin.element.remove();

        pin.element =
            null;

    }

}


/* ============================================================
   RENDER ALL PINS
   ============================================================ */

function renderPins() {

    /*
     * Clear existing DOM pins.
     */

    pins.forEach(
        function(pin) {

            removePinElement(
                pin
            );

        }
    );


    /*
     * Create all pins.
     */

    pins.forEach(
        function(pin) {

            createPinElement(
                pin
            );

        }
    );


    /*
     * Final position update.
     */

    updatePinPositions();

}


/* ============================================================
   NEW PIN MODAL
   ============================================================ */

function openNewPinModal(position) {

    editingPin =
        null;


    newPinPosition =
        [
            position[0],
            position[1],
            position[2]
        ];


    modalTitle.innerText =
        "New Pin";


    pinTitle.value =
        "";


    pinDescription.value =
        "";


    deleteButton.style.display =
        "none";


    showCoordinates(
        newPinPosition
    );


    modalOverlay.style.display =
        "flex";


    setTimeout(
        function() {

            pinTitle.focus();

        },
        0
    );

}


/* ============================================================
   EDIT PIN MODAL
   ============================================================ */

function openEditPinModal(pin) {

    editingPin =
        pin;


    newPinPosition =
        null;


    modalTitle.innerText =
        "Edit Pin";


    pinTitle.value =
        pin.title;


    pinDescription.value =
        pin.text || "";


    deleteButton.style.display =
        "block";


    showCoordinates(
        pin.position
    );


    modalOverlay.style.display =
        "flex";


    setTimeout(
        function() {

            pinTitle.focus();

        },
        0
    );

}


/* ============================================================
   SHOW COORDINATES
   ============================================================ */

function showCoordinates(position) {

    coordinates.innerHTML =

        "X: " +
        position[0].toFixed(6) +

        "<br>" +

        "Y: " +
        position[1].toFixed(6) +

        "<br>" +

        "Z: " +
        position[2].toFixed(6);

}


/* ============================================================
   CLOSE MODAL
   ============================================================ */

function closeModal() {

    modalOverlay.style.display =
        "none";


    editingPin =
        null;


    newPinPosition =
        null;

}


/* ============================================================
   SAVE
   ============================================================ */

saveButton.addEventListener(
    "click",
    function() {

        const title =
            pinTitle.value.trim();


        const text =
            pinDescription.value.trim();


        if (!title) {

            alert(
                "Title is required."
            );

            pinTitle.focus();

            return;

        }


        /*
         * ======================================================
         * NEW PIN
         * ======================================================
         */

        if (!editingPin) {

            const pin = {

                id:
                    crypto.randomUUID(),

                modelId:
                    MODEL_ID,

                position:
                    [
                        newPinPosition[0],
                        newPinPosition[1],
                        newPinPosition[2]
                    ],

                title:
                    title,

                text:
                    text,

                element:
                    null

            };


            pins.push(
                pin
            );


            /*
             * Save first.
             */

            savePins();


            /*
             * Create DOM element immediately.
             */

            createPinElement(
                pin
            );


            setStatus(
                "New pin created"
            );

        }


        /*
         * ======================================================
         * EDIT EXISTING PIN
         * ======================================================
         */

        else {

            editingPin.title =
                title;


            editingPin.text =
                text;


            /*
             * Update label immediately.
             */

            if (
                editingPin.element
            ) {

                const label =
                    editingPin.element
                        .querySelector(
                            ".pinLabel"
                        );


                if (label) {

                    label.innerText =
                        title;

                }

            }


            savePins();


            setStatus(
                "Pin updated"
            );

        }


        closeModal();

    }
);


/* ============================================================
   CANCEL
   ============================================================ */

cancelButton.addEventListener(
    "click",
    function() {

        closeModal();

    }
);


/* ============================================================
   DELETE
   ============================================================ */

deleteButton.addEventListener(
    "click",
    function() {

        if (!editingPin) {

            return;

        }


        if (
            !confirm(
                "Delete this pin?"
            )
        ) {

            return;

        }


        deletePin(
            editingPin
        );


        closeModal();

    }
);


/* ============================================================
   DELETE PIN
   ============================================================ */

function deletePin(pin) {

    removePinElement(
        pin
    );


    pins =
        pins.filter(
            function(item) {

                return item !== pin;

            }
        );


    savePins();


    setStatus(
        "Pin deleted"
    );

}


/* ============================================================
   SHOW PIN INFO
   ============================================================ */

function showPinInfo(pin) {

    infoTitle.innerText =
        pin.title;


    infoText.innerText =
        pin.text || "";


    infoOverlay.style.display =
        "flex";

}


/* ============================================================
   CLOSE INFO
   ============================================================ */

closeInfoButton.addEventListener(
    "click",
    function() {

        infoOverlay.style.display =
            "none";

    }
);


/* ============================================================
   EDIT MODE
   ============================================================ */

editModeButton.addEventListener(
    "click",
    function() {

        editMode =
            !editMode;


        if (editMode) {

            editModeButton.innerText =
                "Disable Edit Mode";


            editModeButton.classList.add(
                "active"
            );


            modeLabel.innerText =
                "Edit Mode: ON";


            setStatus(
                "Click model to add a pin"
            );

        }
        else {

            editModeButton.innerText =
                "Enable Edit Mode";


            editModeButton.classList.remove(
                "active"
            );


            modeLabel.innerText =
                "Edit Mode: OFF";


            setStatus(
                "View Mode"
            );

        }

    }
);


/* ============================================================
   SAVE PINS
   ============================================================ */

function savePins() {

    /*
     * Do NOT save DOM element.
     */

    const data =
        pins.map(
            function(pin) {

                return {

                    id:
                        pin.id,

                    modelId:
                        pin.modelId,

                    x:
                        pin.position[0],

                    y:
                        pin.position[1],

                    z:
                        pin.position[2],

                    title:
                        pin.title,

                    text:
                        pin.text

                };

            }
        );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            data
        )
    );

}


/* ============================================================
   LOAD PINS
   ============================================================ */

function loadPins() {

    const stored =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!stored) {

        pins =
            [];

        return;

    }


    try {

        const data =
            JSON.parse(
                stored
            );


        pins =
            data.map(
                function(item) {

                    return {

                        id:
                            item.id,

                        modelId:
                            item.modelId,

                        position:
                            [
                                Number(item.x),
                                Number(item.y),
                                Number(item.z)
                            ],

                        title:
                            item.title,

                        text:
                            item.text || "",

                        element:
                            null

                    };

                }
            );


        /*
         * Render immediately.
         */

        renderPins();


        setStatus(
            pins.length +
            " pins loaded"
        );

    }
    catch (error) {

        console.error(
            "Error loading pins:",
            error
        );


        pins =
            [];

    }

}


/* ============================================================
   EXPORT
   ============================================================ */

document
    .getElementById(
        "exportButton"
    )
    .addEventListener(
        "click",
        function() {

            const data =
                pins.map(
                    function(pin) {

                        return {

                            modelId:
                                pin.modelId,

                            x:
                                pin.position[0],

                            y:
                                pin.position[1],

                            z:
                                pin.position[2],

                            title:
                                pin.title,

                            text:
                                pin.text

                        };

                    }
                );


            const json =
                JSON.stringify(
                    data,
                    null,
                    4
                );


            console.log(
                json
            );


            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                MODEL_ID +
                "-pins.json";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
                url
            );

        }
    );


/* ============================================================
   CLEAR ALL
   ============================================================ */

document
    .getElementById(
        "clearButton"
    )
    .addEventListener(
        "click",
        function() {

            if (!editMode) {

                alert(
                    "Enable Edit Mode first."
                );

                return;

            }


            if (!pins.length) {

                return;

            }


            if (
                !confirm(
                    "Delete all pins?"
                )
            ) {

                return;

            }


            pins.forEach(
                function(pin) {

                    removePinElement(
                        pin
                    );

                }
            );


            pins =
                [];


            localStorage.removeItem(
                STORAGE_KEY
            );


            setStatus(
                "All pins deleted"
            );

        }
    );


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(message) {

    status.innerText =
        message;

}


/* ============================================================
   ESCAPE KEY
   ============================================================ */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeModal();


            infoOverlay.style.display =
                "none";

        }

    }
);


</script>
